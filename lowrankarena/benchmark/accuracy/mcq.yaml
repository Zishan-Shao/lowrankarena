name: mcq
kind: eval
description: Multiple-choice accuracy suite using exact lm-eval-harness 0.4.11 task IDs.
selection:
  checkpoints:
    - llama31-8b-asvd-0.4
    - llama31-8b-dobi-0.8
    - llama31-8b-svdllm-v1-update-0.6
    - llama31-8b-svdllm-v2-0.6
    - llama31-8b-basis-sharing-0.6
    - llama-7b-svdllm-v1-update-0.5
    - llama-7b-basis-sharing-0.5
    - llama-7b-dobi-0.8
  enabled_only: true
eval:
  backend: lm_eval_harness
  version: 0.4.11
  dataset: lm_eval_harness
  dtype: float16
  metric: acc_norm
  metric_fallbacks:
    - acc
  tracked_metrics:
    - acc
    - acc_norm
  metric_aggregation: macro_mean
  batch_size: auto
  num_fewshot: 0
  tasks:
    - boolq
    - arc_easy
    - arc_challenge
    - winogrande
    - piqa
    - hellaswag
    - openbookqa
report:
  result_dir: results/leaderboard/eval
  output_dir: results/tables
  filename: mcq.md
