name: leaderboard_memory
kind: memory
description: Formal active-memory measurement suite for the frozen leaderboard checkpoint set.
selection:
  checkpoints:
    - llama31-8b-asvd-0.4
    - llama31-8b-dobi-0.8
    - llama31-8b-svdllm-v1-update-0.6
    - llama31-8b-svdllm-v2-0.6
    - llama31-8b-basis-sharing-0.6
    - llama-7b-svdllm-v1-update-0.5
    - llama-7b-basis-sharing-0.5
    - llama-7b-dobi-0.8
  enabled_only: true
memory:
  backend: transformers
  dtype: float16
  batch_size: 1
  prompt_length: 512
  generation_length: 128
report:
  result_dir: results/leaderboard/memory
  output_dir: results/tables
  filename: leaderboard_memory.md
