[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lowrankarena"
version = "0.1.0"
description = "Scaffold for LowRankArena benchmark and checkpoint management."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "LowRankArena" },
]
dependencies = [
  "torch==2.10.0",
  "transformers==4.57.6",
  "huggingface_hub==0.36.2",
  "PyYAML==6.0.3",
  "safetensors==0.5.3",
  "sentencepiece==0.2.1",
  "accelerate==1.10.1",
]

[project.optional-dependencies]
eval = [
  "lm_eval==0.4.11",
  "datasets==4.4.2",
  "evaluate==0.4.5",
]
speed = [
  "vllm==0.18.1; python_version < '3.14'",
]
full = [
  "lm_eval==0.4.11",
  "datasets==4.4.2",
  "evaluate==0.4.5",
  "vllm==0.18.1; python_version < '3.14'",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["src*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
