audit_id: "3"
kind: stability
title: Calibration subset / seed stability audit
run_label: appendix_3_stability
compression:
  family: svd
  model: meta-llama/Llama-3.1-8B
  ratio: 0.5
  precision: bf16
  calibration: wikitext2
  recovery: default
  output_root_template: results/audit/3_stability/artifacts/{method}/{subset}
  methods:
    - dobi_svd
    - svd_llm
    - asvd
  calibration_subsets:
    - name: subset0
      seed: 0
      offset: 0
    - name: subset1
      seed: 1
      offset: 1024
    - name: subset2
      seed: 2
      offset: 2048
evaluation:
  output_dir: results/audit/3_stability/eval
  raw_output_dir: results/audit/3_stability/raw
  checkpoint_template: "{model_slug}-{method}-{ratio_tag}-{subset}"
  suites:
    - mcq
    - base/base_math
  options:
    model_backend: vllm
    dtype: auto
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.5
    max_model_len: 4096
