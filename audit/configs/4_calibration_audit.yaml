audit_id: "4"
kind: calibration_audit
title: LM-only calibration vs Alpaca-like calibration audit
run_label: appendix_4_calibration
compression:
  family: svd
  model: meta-llama/Llama-3.1-8B-Instruct
  ratio: 0.5
  precision: bf16
  recovery: default
  seed: 0
  output_root_template: results/audit/4_calibration/artifacts/{method}/{calibration_profile}
  methods:
    - dobi_svd
    - svd_llm
    - asvd
    - basis_sharing
    - svd
  calibration_profiles:
    - name: lm_only
      calibration: wikitext2
    - name: alpaca_like
      calibration: alpaca
evaluation:
  output_dir: results/audit/4_calibration/eval
  raw_output_dir: results/audit/4_calibration/raw
  checkpoint_template: "{model_slug}-{method}-{ratio_tag}-{calibration_profile}"
  baseline_profile: lm_only
  comparison_profile: alpaca_like
  suites:
    - mcq
    - instruct/mmlu_pro
    - instruct/gsm8k
  options:
    model_backend: vllm
    dtype: auto
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.5
    max_model_len: 4096
