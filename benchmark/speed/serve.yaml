name: serve_speed
kind: speed
description: vLLM speed suite for paper-facing mainstream serving workloads.
selection:
  enabled_only: true
speed:
  backend: vllm
  metric_aggregation: macro_mean
  cases:
    - name: interactive_short
      batch_size: 1
      prompt_length: 512
      generation_length: 128
    - name: interactive_long_decode
      batch_size: 1
      prompt_length: 512
      generation_length: 512
    - name: interactive_long_context
      batch_size: 1
      prompt_length: 2048
      generation_length: 128
    - name: balanced_short
      batch_size: 2
      prompt_length: 1024
      generation_length: 128
    - name: balanced_long_decode
      batch_size: 2
      prompt_length: 1024
      generation_length: 512
    - name: throughput_short
      batch_size: 4
      prompt_length: 512
      generation_length: 128
    - name: throughput_long_decode
      batch_size: 4
      prompt_length: 512
      generation_length: 512
  repeat: 7
  warmup: 1
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.35
  dtype: float16
  max_model_len: 3072
  enforce_eager: false
  metrics:
    - prefill_tokens_per_second
    - decode_tokens_per_second
    - end_to_end_tokens_per_second
report:
  result_dir: results/leaderboard/speed
  output_dir: results/tables
  filename: serve_speed.md
