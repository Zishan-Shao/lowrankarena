name: speed
kind: speed
description: vLLM offline inference speed suite for latency and throughput reporting.
selection:
  benchmarks:
    - speed
  enabled_only: true
speed:
  backend: vllm
  prompt_lengths:
    - 512
    - 1024
  generation_lengths:
    - 128
  batch_sizes:
    - 1
    - 4
    - 8
  repeat: 5
  warmup: 1
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.9
  dtype: auto
  enforce_eager: false
  metrics:
    - prefill_tokens_per_second
    - decode_tokens_per_second
    - end_to_end_tokens_per_second
report:
  result_dir: results/speed
  output_dir: results/tables
  filename: speed.md
