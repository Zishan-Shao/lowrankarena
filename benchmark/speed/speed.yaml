name: speed
kind: speed
description: vLLM offline inference speed suite for latency and throughput reporting.
selection:
  checkpoints:
    - llama31-8b-asvd-0.4
    - llama31-8b-dobi-0.8
    - llama31-8b-svdllm-v1-update-0.6
    - llama31-8b-svdllm-v2-0.6
    - llama31-8b-basis-sharing-0.6
    - llama-7b-svdllm-v1-update-0.5
    - llama-7b-basis-sharing-0.5
    - llama-7b-dobi-0.8
  enabled_only: true
speed:
  backend: vllm
  metric_aggregation: macro_mean
  prompt_lengths:
    - 512
    - 1024
  generation_lengths:
    - 128
  batch_sizes:
    - 1
    - 4
    - 8
  repeat: 5
  warmup: 1
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.9
  dtype: auto
  max_model_len: 2048
  enforce_eager: false
  metrics:
    - prefill_tokens_per_second
    - decode_tokens_per_second
    - end_to_end_tokens_per_second
report:
  result_dir: results/speed
  output_dir: results/tables
  filename: speed.md
