name: speed
kind: speed
description: End-to-end evaluation-speed suite for the default paper-facing base accuracy workloads.
selection:
  enabled_only: true
speed:
  backend: evaluation
  model_backend: vllm
  metric_aggregation: macro_mean
  eval_suites:
    - ppl
    - mcq
    - base/base_math
  metrics:
    - total_wall_time_seconds
    - mean_suite_wall_time_seconds
report:
  result_dir: results/speed
  output_dir: results/tables
  filename: evaluation_speed.md
