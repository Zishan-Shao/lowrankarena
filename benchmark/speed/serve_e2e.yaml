name: serve_e2e_speed
kind: speed
description: Online vLLM serving benchmark using vllm serve plus vllm bench serve.
selection:
  enabled_only: true
speed:
  backend: vllm_bench_serve
  metric_aggregation: macro_mean
  profiles:
    - name: prefill_heavy_4k_to_32
      input_length: 4096
      output_length: 32
    - name: balanced_2k_to_128
      input_length: 2048
      output_length: 128
    - name: decode_heavy_512_to_512
      input_length: 512
      output_length: 512
  client_backend: openai
  endpoint: /v1/completions
  host: 127.0.0.1
  port: 8000
  request_rate: 1.0
  num_prompts: 64
  max_concurrency: 16
  num_warmups: 1
  seed: 0
  random_range_ratio: 0.0
  ignore_eos: true
  metric_percentiles:
    - 50
    - 95
    - 99
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.6
  dtype: float16
  max_model_len: 4608
  enforce_eager: false
  ready_check_timeout_seconds: 600
  server_startup_grace_seconds: 2.0
  server_log_level: error
  metrics:
    - ttft_ms
    - tpot_ms
    - itl_ms
    - e2e_latency_ms
    - request_throughput
    - output_tokens_per_second
report:
  result_dir: results/leaderboard/speed
  output_dir: results/tables
  filename: serve_e2e_speed.md
