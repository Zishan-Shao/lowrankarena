name: edge_speed
kind: speed
description: Frozen vLLM edge-case suite for long-context serving workloads with batch size at most 4 and sequence lengths near 16K.
selection:
  checkpoints:
    - llama31-8b-asvd-0.4
    - llama31-8b-dobi-0.8
    - llama31-8b-svdllm-v1-update-0.6
    - llama31-8b-svdllm-v2-0.6
    - llama31-8b-basis-sharing-0.6
    - llama-7b-svdllm-v1-update-0.5
    - llama-7b-basis-sharing-0.5
    - llama-7b-dobi-0.8
  enabled_only: true
speed:
  backend: vllm
  metric_aggregation: macro_mean
  cases:
    - name: edge_prefill_4k_b4
      batch_size: 4
      prompt_length: 4096
      generation_length: 128
    - name: edge_decode_4k_b4
      batch_size: 4
      prompt_length: 4096
      generation_length: 512
    - name: edge_prefill_8k_b2
      batch_size: 2
      prompt_length: 8192
      generation_length: 128
    - name: edge_decode_8k_b2
      batch_size: 2
      prompt_length: 8192
      generation_length: 512
    - name: edge_prefill_near_16k_b1
      batch_size: 1
      prompt_length: 15872
      generation_length: 128
    - name: edge_decode_near_16k_b1
      batch_size: 1
      prompt_length: 15360
      generation_length: 512
  repeat: 7
  warmup: 1
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.6
  dtype: float16
  max_model_len: 16384
  enforce_eager: false
  metrics:
    - prefill_tokens_per_second
    - decode_tokens_per_second
    - end_to_end_tokens_per_second
report:
  result_dir: results/edge/speed
  output_dir: results/tables
  filename: edge_speed.md
