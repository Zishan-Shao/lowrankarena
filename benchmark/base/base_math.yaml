name: base_math
kind: eval
description: Base-model math suite using MathQA plus a local MMLU_Math MCQ/loglikelihood group suitable for non-instruct checkpoints.
selection:
  variants:
    - base
  enabled_only: true
eval:
  backend: lm_eval_harness
  model_backend: vllm
  version: 0.4.11
  dataset: lm_eval_harness_with_local_mathqa_and_local_mmlu_math
  dtype: auto
  metric: acc_norm
  metric_fallbacks:
    - acc
  tracked_metrics:
    - acc
    - acc_norm
  metric_aggregation: macro_mean
  batch_size: auto
  include_paths:
    - benchmark/base/tasks
  tasks:
    - lra_mathqa
    - mmlu_math
report:
  result_dir: results/leaderboard/eval
  output_dir: results/tables
  filename: base_math.md
