task: mathqa_local
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    test: "../data/mathqa/test.jsonl"
output_type: multiple_choice
test_split: test
doc_to_text: "Question: {{Problem}}\nOptions: {{options}}\nAnswer:"
doc_to_target: "{% set m = {'a': 0, 'b': 1, 'c': 2, 'd': 3, 'e': 4} %}{{ m[correct] }}"
doc_to_choice:
  - "a"
  - "b"
  - "c"
  - "d"
  - "e"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
